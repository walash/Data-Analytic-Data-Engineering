name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0

      - name: Run flake8
        run: |
          flake8 src dags --max-line-length=100 --extend-ignore=E203,W503

  smoke-test:
    name: Smoke test (ingest dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.31.0 tenacity==8.2.3 pyyaml==6.0.1

      - name: Run ingestion in dry-run mode
        run: |
          python src/ingestion/ingest.py --dry-run

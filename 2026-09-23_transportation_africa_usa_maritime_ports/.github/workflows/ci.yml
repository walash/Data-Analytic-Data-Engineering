name: CI - Maritime Ports Pipeline

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 requests pandas pyyaml

      - name: Lint with flake8
        run: |
          flake8 src/ --count --max-line-length=100 \
            --extend-ignore=E203,W503 --show-source --statistics

      - name: Smoke test (ingestion dry-run)
        run: |
          python src/ingestion/ingest.py --dry-run

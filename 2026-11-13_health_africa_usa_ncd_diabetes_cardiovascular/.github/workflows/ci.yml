name: CI - NCD Africa vs USA pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0

      - name: Run flake8
        run: |
          flake8 src dags --max-line-length=100 --extend-ignore=E203,W503 --count --show-source --statistics

  smoke-test:
    name: Smoke test (ingestion + transform + load)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.1.4 numpy==1.26.2 requests==2.31.0 retry==0.9.2 pyyaml==6.0.1

      - name: Compile all Python sources
        run: python -m py_compile src/ingestion/ingest.py src/transformation/transform.py src/loading/load.py

      - name: Ingestion dry-run (config validation, no network)
        run: python src/ingestion/ingest.py --dry-run

      - name: Live ingestion smoke test (1 page per indicator, World Bank API)
        run: |
          python src/ingestion/ingest.py --max-pages 1 --output-dir /tmp/ncd_smoke
          test -s /tmp/ncd_smoke/diabetes_prevalence.csv
          head -n 3 /tmp/ncd_smoke/diabetes_prevalence.csv

      - name: Transform and load committed raw data
        run: |
          python src/transformation/transform.py
          python src/loading/load.py
          test -s data/ncd_health.db

name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 requests pandas pyyaml

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=120 --count --statistics

      - name: Compile all Python files
        run: find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile

      - name: Ingestion dry run
        run: python src/ingestion/ingest.py --dry-run

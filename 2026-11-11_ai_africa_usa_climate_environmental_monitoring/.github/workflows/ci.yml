name: CI Pipeline

on:
  push:
  pull_request:

env:
  PROJECT_SUBDIR: 2026-11-11_ai_africa_usa_climate_environmental_monitoring

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate project directory (standalone repo or monorepo sub-folder)
        run: |
          if [ -d "$PROJECT_SUBDIR" ]; then echo "PROJECT_DIR=$PROJECT_SUBDIR" >> "$GITHUB_ENV"; else echo "PROJECT_DIR=." >> "$GITHUB_ENV"; fi

      - name: Install lightweight dependencies (no Airflow)
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyyaml flake8

      - name: Run flake8
        run: |
          cd "$PROJECT_DIR"
          flake8 src dags --max-line-length=100 --count --show-source --statistics

  smoke-test:
    name: Smoke test (ingest --dry-run)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate project directory (standalone repo or monorepo sub-folder)
        run: |
          if [ -d "$PROJECT_SUBDIR" ]; then echo "PROJECT_DIR=$PROJECT_SUBDIR" >> "$GITHUB_ENV"; else echo "PROJECT_DIR=." >> "$GITHUB_ENV"; fi

      - name: Install lightweight dependencies (no Airflow)
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyyaml flake8

      - name: Validate configuration
        run: |
          cd "$PROJECT_DIR"
          python -c "import yaml; c = yaml.safe_load(open('config/config.yaml')); assert len(c['countries']) == 30; assert len(c['indicators']) == 5; print('config OK')"

      - name: Dry-run ingestion
        run: |
          cd "$PROJECT_DIR"
          python src/ingestion/ingest.py --dry-run

name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8 and pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 requests==2.31.0 pandas==2.1.4 numpy==1.26.2 pyyaml==6.0.1

      - name: Lint src/ with flake8
        run: flake8 src/ --max-line-length=120 --count --show-source --statistics

      - name: Smoke test - ingestion dry run
        run: python src/ingestion/ingest.py --dry-run

      - name: Smoke test - transform and load committed raw data
        run: |
          if ls data/raw/*.csv >/dev/null 2>&1; then
            python src/transformation/transform.py
            python src/loading/load.py
          else
            echo "No raw data committed; skipping transform/load smoke test"
          fi

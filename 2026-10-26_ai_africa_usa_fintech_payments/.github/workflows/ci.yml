name: CI - Fintech Africa USA pipeline

on:
  push:
    branches: [linkedin-posts]
  pull_request:
    branches: [linkedin-posts]

defaults:
  run:
    working-directory: 2026-10-26_ai_africa_usa_fintech_payments

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 2026-10-26_ai_africa_usa_fintech_payments/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8 on all Python files
        run: flake8 . --count --max-line-length=120 --extend-exclude=.venv,venv,build --show-source --statistics

  smoke-test:
    name: Smoke test (ingest --dry-run)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 2026-10-26_ai_africa_usa_fintech_payments/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all modules
        run: python -m py_compile src/ingestion/ingest.py src/transformation/transform.py src/loading/load.py

      - name: Validate config YAML
        run: python -c "import yaml; yaml.safe_load(open('config/config.yaml'))"

      - name: Dry-run ingestion
        run: python src/ingestion/ingest.py --dry-run

name: CI - Africa USA Student Mobility

on:
  push:
    paths:
      - "2026-10-21_immigration_africa_usa_student_mobility/**"
  pull_request:
    paths:
      - "2026-10-21_immigration_africa_usa_student_mobility/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: 2026-10-21_immigration_africa_usa_student_mobility

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8==7.1.1

      - name: Lint with flake8
        run: flake8 src/ dags/ --max-line-length=110 --count --show-source --statistics

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 2026-10-21_immigration_africa_usa_student_mobility/requirements.txt

      - name: Install runtime dependencies (Airflow/Jupyter excluded)
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(apache-airflow|jupyter)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Ingestion dry run (config + URL validation, no network)
        run: python src/ingestion/ingest.py --dry-run

      - name: Transform committed raw data
        run: python src/transformation/transform.py

      - name: Load into SQLite
        run: python src/loading/load.py

      - name: Assert database contents
        run: |
          python - <<'EOF'
          import sqlite3
          conn = sqlite3.connect("data/student_mobility.db")
          checks = {
              "countries": 16,
              "indicators": 6,
          }
          for table, expected in checks.items():
              n = conn.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              assert n == expected, f"{table}: expected {expected}, got {n}"
          for table in ("indicator_observations", "country_year_metrics", "mobility_snapshot"):
              n = conn.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              assert n > 0, f"{table} is empty"
              print(f"{table}: {n} rows")
          EOF

      - name: Run analytical SQL queries
        run: sqlite3 data/student_mobility.db < sql/queries.sql > query_results.txt && head -n 40 query_results.txt

      - name: Validate notebook, YAML and compose files
        run: |
          python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/analysis.ipynb', as_version=4))"
          python -c "import yaml; yaml.safe_load(open('config/config.yaml')); yaml.safe_load(open('docker/docker-compose.yml'))"

name: CI - EdTech Learning Analytics Pipeline

on:
  push:
  pull_request:

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pandas requests pyyaml

      - name: Lint src/ with flake8
        run: flake8 src/ --max-line-length=100

      - name: Smoke test - import pipeline modules
        run: |
          python -c "import src.ingestion.ingest"
          python -c "import src.transformation.transform"
          python -c "import src.loading.load"

      - name: Smoke test - ingestion dry run
        run: python src/ingestion/ingest.py --dry-run

      - name: Smoke test - transform and load committed raw data
        run: |
          python src/transformation/transform.py
          python src/loading/load.py

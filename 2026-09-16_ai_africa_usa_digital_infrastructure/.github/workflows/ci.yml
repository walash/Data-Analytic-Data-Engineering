name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8==7.0.0

      - name: Run flake8 on src/ and dags/
        run: flake8 src/ dags/ --max-line-length=100 --extend-ignore=E203,W503

  smoke-test:
    name: Smoke test (imports)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.1.4 requests==2.31.0 pyyaml==6.0.1 \
                      numpy==1.26.3 sqlalchemy==2.0.25

      - name: Import ingestion module
        run: python -c "import src.ingestion.ingest; print('ingest import OK')"

      - name: Import transformation and loading modules
        run: |
          python -c "import src.transformation.transform; print('transform import OK')"
          python -c "import src.loading.load; print('load import OK')"

name: CI - Africa USA Railway Networks

on:
  push:
    paths:
      - "2026-10-19_transportation_africa_usa_railway_networks/**"
  pull_request:
    paths:
      - "2026-10-19_transportation_africa_usa_railway_networks/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: 2026-10-19_transportation_africa_usa_railway_networks

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 2026-10-19_transportation_africa_usa_railway_networks/requirements.txt

      - name: Install dependencies
        # Airflow and Jupyter are only needed for orchestration / notebooks, so CI
        # installs the pipeline runtime and tooling pins from requirements.txt.
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(apache-airflow|jupyter)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=110 --count --show-source --statistics

      - name: Smoke test ingestion (dry run)
        run: python src/ingestion/ingest.py --dry-run

      - name: Validate notebook and YAML files
        run: |
          python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/analysis.ipynb', as_version=4))"
          python -c "import yaml; yaml.safe_load(open('config/config.yaml')); yaml.safe_load(open('docker/docker-compose.yml'))"

name: CI Pipeline

on:
  push:
    branches: [main, linkedin-posts]
  pull_request:
    branches: [main, linkedin-posts]

defaults:
  run:
    working-directory: 2026-11-02_transportation_africa_usa_urban_transit_brt

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        # apache-airflow needs its constraints file (SQLAlchemy < 2.0); it is
        # not required for linting or the smoke test, so it is skipped here.
        run: |
          python -m pip install --upgrade pip
          grep -v "^apache-airflow" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run flake8 on src/
        run: flake8 src/ --max-line-length=120 --count --statistics

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          grep -v "^apache-airflow" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Import ingestion module
        run: python -c "import sys; sys.path.insert(0, 'src'); from ingestion.ingest import fetch_world_bank_indicator; print('Smoke test passed')"

# Run from the project root:  docker compose -f docker/docker-compose.yml up --build
services:
  db:
    image: alpine:3.19
    container_name: transit_sqlite_db
    # Lightweight SQLite host: owns the shared data volume and offers the
    # sqlite3 CLI (docker compose exec db sqlite3 /data/transit_analytics.db)
    command: sh -c "apk add --no-cache sqlite >/dev/null && touch /data/.db_ready && tail -f /dev/null"
    environment:
      DB_PATH: /data/transit_analytics.db
    volumes:
      - ../data:/data
    healthcheck:
      test: ["CMD-SHELL", "command -v sqlite3 && test -f /data/.db_ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: urban-transit-brt-pipeline:latest
    container_name: transit_brt_pipeline
    environment:
      DATA_DIR: /app/data
      DB_PATH: /app/data/transit_analytics.db
      CONFIG_PATH: /app/config/config.yaml
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../data:/app/data
      - ../config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:3

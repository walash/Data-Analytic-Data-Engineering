name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: pip install flake8==7.0.0

      - name: Run flake8 on src/
        run: flake8 src/ --max-line-length=100 --extend-ignore=E203,W503

  smoke-test:
    name: Ingestion dry-run smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: pip install requests==2.31.0 pyyaml==6.0.1

      - name: Run ingestion dry-run
        run: python src/ingestion/ingest.py --dry-run

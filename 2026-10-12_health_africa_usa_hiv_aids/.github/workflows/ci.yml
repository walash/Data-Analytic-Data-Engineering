name: CI - HIV/AIDS Africa & USA pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, compile and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements (Airflow excluded, see requirements.txt note)
        run: |
          python -m pip install --upgrade pip
          grep -v '^apache-airflow' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Lint with flake8
        run: |
          flake8 src/ --max-line-length=100 --extend-ignore=E203,W503 --statistics

      - name: Compile all Python files
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile
          echo "All Python files compiled successfully"

      - name: Smoke test ingestion (dry run)
        run: |
          python src/ingestion/ingest.py --dry-run

name: CI - Africa LNG Exports Pipeline

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Airflow and Jupyter are not needed for lint / smoke tests and are
        # excluded to keep the job fast and free of resolver conflicts.
        run: |
          python -m pip install --upgrade pip
          grep -Ev '^(apache-airflow|jupyter)==' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=100 --count --statistics

      - name: Smoke test - import pipeline modules
        run: |
          python -c "import src.ingestion.ingest"
          python -c "import src.transformation.transform"
          python -c "import src.loading.load"

      - name: Smoke test - ingestion dry run
        run: python src/ingestion/ingest.py --dry-run

      - name: Smoke test - transform and load bundled raw data
        run: |
          python src/transformation/transform.py
          python src/loading/load.py --report
          cat data/pipeline_report.txt

      - name: Validate notebook JSON
        run: python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/analysis.ipynb', as_version=4))"

      - name: Run pytest (if tests exist)
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            pytest -q tests
          else
            echo "No tests directory found - skipping pytest"
          fi

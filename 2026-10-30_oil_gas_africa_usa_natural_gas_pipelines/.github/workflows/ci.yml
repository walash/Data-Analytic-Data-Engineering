name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: pip install flake8==7.5.0
      - name: Lint Python sources
        run: flake8 src dags --max-line-length=120 --count --show-source --statistics
      - name: Validate YAML and notebook JSON
        run: |
          pip install PyYAML==6.0.3 nbformat==5.11.1
          python -c "import yaml; yaml.safe_load(open('config/config.yaml')); yaml.safe_load(open('docker/docker-compose.yml'))"
          python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/analysis.ipynb', as_version=4))"

  pipeline-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ingestion dry run (config validation, no network)
        run: python src/ingestion/ingest.py --dry-run
      - name: Transform committed raw data
        run: python src/transformation/transform.py
      - name: Load into SQLite
        run: python src/loading/load.py
      - name: Run analytical SQL
        run: sqlite3 -header -column data/natural_gas.db < sql/queries.sql
      - name: Execute analysis notebook
        run: jupyter nbconvert --to notebook --execute notebooks/analysis.ipynb --output /tmp/analysis_executed.ipynb

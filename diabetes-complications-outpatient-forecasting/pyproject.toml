[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2d_complications_forecasting"
version = "1.0.0"
description = "End-to-end healthcare data engineering framework with predictive modelling for Type 2 Diabetes complications and outpatient clinic load forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "walash" }]
keywords = ["healthcare", "data-engineering", "machine-learning", "forecasting", "diabetes"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "prophet>=1.1",
    "pulp>=2.7",
    "pydantic>=2.0",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
t2d-pipeline = "main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

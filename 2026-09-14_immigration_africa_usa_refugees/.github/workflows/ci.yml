name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8==6.1.0

      - name: Lint source and DAGs
        # E501 (line length) and W503 (line break before operator) are relaxed;
        # everything else is enforced across src/ and dags/.
        run: |
          flake8 src dags --max-line-length=100 --extend-ignore=E501,W503

  smoke-test:
    name: Smoke test (ingestion dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: pip install requests==2.31.0 tenacity==8.2.3 pyyaml==6.0.1

      - name: Run ingestion dry-run
        run: python src/ingestion/ingest.py --dry-run
